name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Security scan (pacotes vulneráveis)
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Foram encontrados pacotes com vulnerabilidades conhecidas."
            exit 1
          fi
          echo "Nenhum pacote vulnerável encontrado."

      - name: Test
        run: dotnet test -c Release --no-build

      # --- Fase 4: containerização -------------------------------------------------------------
      # A tag imutável do commit mantém a imagem rastreável ao código que a gerou.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # SÓ o SHA. `github.ref_name` NÃO serve de tag: em PR ele é `34/merge`, e numa branch
          # `feat/x` também tem barra. O Docker lê `catalog-api:34/merge` como registry
          # `catalog-api` na porta 34 — passa com push: false e quebra quando o push for ligado.
          tags: ${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Dependências externas podem falhar sem banco/fila no CI; o smoke test valida que o
      # processo da API continua ativo, não a prontidão dos serviços externos.
      - name: A imagem inicia?
        run: |
          docker run -d --name smoke ${{ github.event.repository.name }}:${{ github.sha }}
          sleep 10
          docker logs smoke
          docker inspect --format '{{.State.Running}}' smoke | grep -q '^true$' \
            || { echo "::error::o container morreu nos primeiros 10s"; docker logs smoke; exit 1; }

  # --- Fase 4: publicação no ECR e deploy no EKS (#32) ------------------------------------------
  # Só na `main`, e só com a variável da organização AWS_DEPLOY_HABILITADO=true. Fora da sessão do AWS
  # Academy ela fica `false` (scripts/atualizar-credenciais-ci.sh, no orchestration), e o CI segue
  # construindo e testando sem falhar por credencial expirada.
  #
  # Credenciais: as de SESSÃO do lab, em secrets da organização. O laboratório não permite OIDC
  # (orchestration, ADR 0010); elas expiram em ~4 h e não são de longa duração.
  publicar:
    name: Publicar a imagem no ECR
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais da sessão do AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login no ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Tag = SHA do commit, e o repositório do ECR é IMMUTABLE: a tag aponta para uma única imagem
      # para sempre, e o deploy é rastreável até o commit.
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/fcg/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha

  # Rolling update pelo workflow COMPARTILHADO do orchestration, em vez de uma cópia por serviço.
  deploy:
    needs: publicar
    uses: fcg-grupo-16/orchestration/.github/workflows/deploy-servico.yml@main
    with:
      servico: ${{ github.event.repository.name }}
      tag: ${{ github.sha }}
    secrets: inherit

