name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Security scan (pacotes vulneráveis)
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "::error::Foram encontrados pacotes com vulnerabilidades conhecidas."
            exit 1
          fi
          echo "Nenhum pacote vulnerável encontrado."

      - name: Test
        run: dotnet test -c Release --no-build

      # --- Fase 4: containerização -------------------------------------------------------------
      # A tag imutável do commit mantém a imagem rastreável; a tag da ref facilita inspeção.
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            ${{ github.event.repository.name }}:${{ github.sha }}
            ${{ github.event.repository.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Dependências externas podem falhar sem banco/fila no CI; o smoke test valida que o
      # processo da API continua ativo, não a prontidão dos serviços externos.
      - name: A imagem inicia?
        run: |
          docker run -d --name smoke ${{ github.event.repository.name }}:${{ github.sha }}
          sleep 10
          docker logs smoke
          docker inspect --format '{{.State.Running}}' smoke | grep -q '^true$' \
            || { echo "::error::o container morreu nos primeiros 10s"; docker logs smoke; exit 1; }
